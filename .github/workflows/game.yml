name: Caça aos Aliens

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: jogo
  cancel-in-progress: false

jobs:
  jogada:
    if: startsWith(github.event.issue.title, 'alien|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Processar jogada
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: python game/game.py
      - name: Salvar tabuleiro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git commit -m "🎮 Jogada de @${{ github.event.issue.user.login }}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Responder e fechar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "${{ runner.temp }}/reply.md"
          gh issue close "$NUMBER"
